<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeType+ Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">SafeType+ settings</p>
      <h1>Connection</h1>
      <p class="subhead">
        Point the extension at the backend API that powers the web app.
      </p>

      <form id="settings-form">
        <label>
          Backend API URL
          <input id="backend-url" type="url" placeholder="http://localhost:5000/api" />
        </label>

        <label>
          API key
          <input id="api-key" type="password" placeholder="Optional" />
        </label>

        <button type="submit">Save settings</button>
      </form>

      <p id="status" class="status">Ready</p>
    </main>

    <script src="options.js"></script>
  </body>
</html>
